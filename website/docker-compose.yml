# =============================================================================
# The website, with its database somewhere else.
#
# The database is a Coolify-managed MariaDB resource, not a service in this file.
# That is the owner's decision (2026-10-12) and it reverses the earlier "MariaDB
# as a service in the deploy" arrangement from the same day.
#
# What that means in practice:
#
#   * The `migrate` service stays. It applies pending migrations and re-applies
#     the grants on every deploy, and it points at the external host. Dropping
#     it would put us back to applying grants.sql by hand, which is how the
#     corrected portal_users grant sat in the repository for hours without ever
#     reaching a database.
#
#   * The application connects as `nifty_website`, NOT as the database's admin
#     account. The admin connection is used by `migrate` alone. This is the whole
#     point of ADR-0007: the web pool cannot approve an application, cannot read
#     a player's wallet and cannot touch the pairing codes. Logging the app in as
#     an admin account would remove that boundary without changing one line of
#     application code.
#
#   * Both containers JOIN Coolify's shared network. The database hostname is a
#     Docker-internal name that only resolves there — it is not a public address.
# =============================================================================

name: nifty-life-website

services:
  # Runs once per `docker compose up`, applies whatever is pending, and exits.
  # `service_completed_successfully` below makes this a gate, not a race: the
  # application never starts against a schema that is behind.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    restart: "no"

    environment:
      DB_HOST: ${DB_HOST:?DB_HOST must be set - the external database address}
      DB_PORT: ${DB_PORT:-3306}
      MARIADB_DATABASE: ${DB_NAME:-nifty_life}

      # The admin connection, used for CREATE DATABASE, CREATE USER and GRANT.
      # Defaults to root because that is what the scripts have always used.
      # If the external database's admin account has a different name, set
      # MIGRATE_DB_USER — that is the only variable here that is not also
      # read by the application.
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:-root}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}

      # Passwords the three accounts are created with.
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?GAME_DB_PASSWORD must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set}

      # Host patterns for the GRANT statements.
      #
      # '%' because the source address is no longer ours to choose: the app is on
      # Coolify's shared network, so the address MariaDB sees depends on that
      # network's subnet. That is a weaker boundary than the fixed compose subnet
      # was — it is the price of an external database, and it is only acceptable
      # while that database is not reachable from outside Coolify.
      WEB_DB_HOST: ${WEB_DB_HOST:-%}
      GAME_DB_HOST: ${GAME_DB_HOST:-%}

    # A preflight, not just a command: the first run of this service exited 127
    # with no output at all, which distinguishes nothing. /bin/sh rather than
    # /bin/bash so the diagnostics run even if bash is what turned out to be
    # missing.
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "migrate: preflight"
        echo "  image        : $(cat /etc/os-release 2>/dev/null | grep ^PRETTY | cut -d= -f2-)"
        echo "  /docker-scripts: $([ -d /docker-scripts ] && echo yes || echo NO)"
        echo "  migrations dir : $([ -d /docker-scripts/initdb/migrations ] && echo yes || echo NO)"
        echo "  bash          : $(command -v bash || echo MISSING)"
        echo "  mariadb client: $(command -v mariadb || echo MISSING)"
        echo "  database      : ${MIGRATE_DB_USER:-root}@${DB_HOST}:${DB_PORT:-3306}/${MARIADB_DATABASE:-nifty_life}"
        echo "migrate: running the runner"
        exec bash /docker-scripts/initdb/run-migrations.sh

    networks:
      - coolify

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully

    # Local development convenience only. On the deploy host this file does not
    # exist and the values come from the platform's own secret store.
    env_file:
      - path: .env
        required: false

    environment:
      # The restricted pool. DB_HOST is the external database's address; it must
      # not be 127.0.0.1 inside this container, where loopback is the container.
      DB_HOST: ${DB_HOST:?DB_HOST must be set - the external database address}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-nifty_life}
      DB_USER: nifty_website
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_ADMIN_USER: nifty_admin
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set}

    ports:
      # Host 3101 -> container 3000. The proxy has to be pointed at 3101 too, or
      # it talks to nothing and every request 502s. APP_PORT overrides the host
      # side only; the container always listens on 3000.
      - "${APP_PORT:-3101}:3000"

    networks:
      - coolify

networks:
  # Coolify's shared network. The database hostname only resolves inside it.
  coolify:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}