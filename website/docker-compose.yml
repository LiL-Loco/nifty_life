# =============================================================================
# The website and its database, as one deployable unit.
#
# This is what the owner chose over "keep MariaDB bare-metal and let the
# container reach it". MariaDB is therefore a service here, not a system
# service on the host. Two consequences are deliberate and recorded in
# docs/adr/0024-database-in-the-deploy.md:
#
#   1. The web accounts in grants.sql are bound to the compose subnet, not to
#      'localhost', because 'localhost' matches no container on any network.
#   2. Binary logging is switched back on below so point-in-time recovery from
#      ADR-0006 is still POSSIBLE. The dump schedule, the offsite copies and
#      the restore drill are NOT provided here — see the ADR.
#
# THE DATABASE PORT IS NOT PUBLISHED TO THE WORLD.
#
# It is bound to 127.0.0.1 because the game server on the host still needs it.
# That binding is what makes GAME_DB_HOST='%' acceptable below: nothing but the
# host itself can open a TCP connection to it. Publishing this on 0.0.0.0 would
# put the entire player database one password away from the internet.
# =============================================================================

name: nifty-life-website

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: nifty_life
      # These four names are the ones the website's own .env already uses, so an
      # existing configuration can be copied over unchanged. Only DB_ROOT_PASSWORD
      # and GAME_DB_PASSWORD are new, and neither is read by the application:
      # they exist for the database container during the init.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}

      # Consumed by docker/initdb/000-users.sh and 900-grants.sh, which create
      # the three accounts from database/grants.sql. The entrypoint passes NO of
      # these to a .sql file, which is exactly why those scripts exist.
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:?GAME_DB_PASSWORD must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set}

      # Host patterns for the GRANT statements. 'localhost' is wrong here: the
      # app connects from a container address. WEB_DB_HOST stays on the compose
      # subnet so only containers on this network match; GAME_DB_HOST is '%'
      # because the game server's apparent source address depends on how the
      # published port is NATted, which is not something we control.
      WEB_DB_HOST: ${WEB_DB_HOST:-172.30.%}
      GAME_DB_HOST: ${GAME_DB_HOST:-%}

    command:
      - --log-bin=/var/lib/mysql/mysql-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=604800
      - --server-id=1

    volumes:
      - db_data:/var/lib/mysql
      # Read-only. The entrypoint runs everything in here once, on an empty
      # data directory. On an existing volume it is skipped — which is correct:
      # re-running the migrations against live data is not something this
      # container is allowed to do behind your back.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

    ports:
      # Loopback only — for the FiveM server on this host. Never 0.0.0.0.
      - "127.0.0.1:3307:3306"

    networks:
      nifty:
        ipv4_address: 172.30.0.20

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      # Generous: on a first boot this container is loading 30 migrations, and
      # a failure here must not be reported as "the database is down".
      retries: 30
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    # Local development convenience only. On the deploy host this file does not
    # exist and the values come from the platform's own secret store.
    env_file:
      - path: .env
        required: false

    environment:
      # The service name, not 127.0.0.1. Inside this container 127.0.0.1 is the
      # container itself, which is the bug that made the first deploy unable to
      # reach a database at all.
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: nifty_life
      DB_USER: nifty_website
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_ADMIN_USER: nifty_admin
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set}

    ports:
      # Host 3001 -> container 3000.
      #
      # 3000 was the Nixpacks default and it is STILL OCCUPIED on this host by
      # the previous deployment of this same site, which kept its container
      # running across the switch to compose. The first compose deployment died
      # with "Bind for 0.0.0.0:3000 failed: port is already allocated". The old
      # container should really be stopped and removed — but the owner decided to
      # move this service to 3001 instead, so the default here is 3001 and the
      # old resource can be retired whenever it suits.
      #
      # THE PROXY MUST MATCH. Coolify's configured port for this resource has to
      # be 3001, otherwise the proxy talks to nothing and every request 502s.
      #
      # APP_PORT overrides the host side only; the container always listens on
      # 3000. If you change it, change the Coolify port to the same value.
      - "${APP_PORT:-3001}:3000"

    networks:
      nifty:
        ipv4_address: 172.30.0.10

networks:
  nifty:
    ipam:
      config:
        # Fixed, because WEB_DB_HOST above grants the web accounts to this
        # subnet. A random Docker-assigned network would silently break every
        # grant the moment the subnet moved.
        - subnet: 172.30.0.0/24

volumes:
  db_data: