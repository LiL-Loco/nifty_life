<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nifty Life 2.0 — Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Two parts that behave differently: the LOG is always present and passive,
       the INPUT only exists while somebody is typing. Splitting them is what lets
       the log fade on its own timer while the input stays until it is cancelled.

       This page never holds the keyboard on its own initiative. It is drawn always
       and takes focus only between `acquire` and `release` in client/cl_chat.lua. -->

  <div id="chatLog" class="chat-log"></div>

  <div id="chatInput" class="chat-input hidden">
    <span class="chat-input__caret">/</span>
    <input
      type="text"
      id="chatField"
      class="chat-input__field"
      maxlength="150"
      autocomplete="off"
      spellcheck="false"
      placeholder="Nachricht — Enter zum Senden, Esc zum Abbrechen">
  </div>

  <script src="https://cfx-nui-nifty-core/ui/base.js"></script>
  <script src="app.js"></script>
</body>
</html>
