<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nifty Life 2.0</title>
  <link rel="stylesheet" href="https://cfx-nui-nifty-core/ui/base.css">
  <link rel="stylesheet" href="https://cfx-nui-nifty-core/ui/menu.css">
</head>
<body class="menu-page">

  <!--
    The single menu surface (ADR-0023).

    One page, one CEF browser, one focus owner. Two resources drawing their own
    menus would put two browsers behind one global SetNuiFocus, and the player
    would be steering a menu they cannot see.

    `dock` on the wrapper is what lets the character creator work: `right` takes a
    column and leaves the middle of the screen alone, so the player watches the
    face change while choosing it. A native GTA menu cannot do that - its panel is
    fullscreen by construction.

    The header carries the visible identity of the page: blue gradient with a
    script font, matching the in-game character creator. The section bar under
    it shows the current menu and the player's progress through it (e.g. "Features
    1 / 11"). Rows are built in JS, never written here. This file is a frame. -->
  <div id="menuRoot" class="menu hidden" data-dock="center">
    <div class="menu__panel">

      <header class="menu__header">
        <h1 id="menuTitle">—</h1>
      </header>

      <div id="menuSection" class="menu__section hidden">
        <span id="menuSectionName" class="menu__section-name">—</span>
        <span id="menuSectionProgress" class="menu__section-progress">—</span>
      </div>

      <p id="menuSubtitle" class="menu__subtitle hidden"></p>

      <div id="menuBody" class="menu__body"></div>

      <footer class="menu__footer">
        <span class="menu__hint">…</span>
      </footer>

    </div>
  </div>

  <script src="https://cfx-nui-nifty-core/ui/base.js"></script>
  <script src="https://cfx-nui-nifty-core/ui/menu.js"></script>
</body>
</html>
