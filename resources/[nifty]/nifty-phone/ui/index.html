<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nifty Life 2.0 — Telefon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- A separate overlay rather than a panel of the HUD (ADR-0018). The panel shell
       is sized for lists of items; a conversation is a different shape, and this is
       also where the Peeper apps will land (ADR-0019).

       This page is hidden until the phone opens, and it takes the keyboard only
       through nifty-ui's focus broker — never by calling SetNuiFocus itself. -->

  <div id="phone" class="phone hidden">

    <div class="phone__device">
      <div class="phone__statusbar">
        <span id="phoneNumber" class="phone__number">—</span>
        <span class="phone__carrier">Nifty</span>
        <span id="phoneBadgeTop" class="phone__badge hidden">0</span>
      </div>

      <nav class="phone__tabs">
        <button type="button" class="phone__tab is-active" data-app="messages">Nachrichten</button>
        <button type="button" class="phone__tab" data-app="compose">Schreiben</button>
      </nav>

      <section class="phone__app is-active" id="appMessages">
        <div id="phoneList" class="phone__list"></div>
      </section>

      <section class="phone__app" id="appCompose">
        <label class="phone__field">
          <span class="phone__label">Nummer</span>
          <input type="text" id="phoneTo" placeholder="555-0000" maxlength="16" autocomplete="off">
        </label>
        <label class="phone__field">
          <span class="phone__label">Nachricht</span>
          <textarea id="phoneBody" rows="6" placeholder="Nachricht schreiben..."></textarea>
        </label>
        <button type="button" id="phoneSend" class="btn btn--primary">Senden</button>
        <p class="phone__hint">
          Nummer und Empfänger werden vom Server geprüft, nicht von diesem Fenster.
        </p>
      </section>

      <footer class="phone__homebar"></footer>
    </div>

  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cfx-nui-nifty-ui/ui/base.js"></script>
  <script src="app.js"></script>
</body>
</html>
