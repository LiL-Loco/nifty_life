<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nifty Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Segoe+UI:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <div id="menuRoot" class="menu hidden" data-dock="center">
      <div class="menuPanel">
        <header class="menuHeader">
          <h1 id="menuTitle" class="menuTitle">&mdash;</h1>
          <p id="menuSubtitle" class="menuSubtitle hidden"></p>
        </header>
        <div id="menuSection" class="menuSection hidden">
          <span id="menuSectionName"></span>
          <span id="menuSectionProgress"></span>
        </div>
        <ul id="menuList" class="menuList"></ul>
        <footer class="menuFooter">
          <span class="menuHint"><span class="menuHint__key">&uarr; &darr;</span> navigieren</span>
          <span class="menuHint"><span class="menuHint__key">&crarr;</span> ausw&auml;hlen</span>
          <span class="menuHint"><span class="menuHint__key">esc</span> zur&uuml;ck</span>
        </footer>
      </div>
    </div>
    <script src="base.js"></script>
    <script src="menu.js"></script>
  </body>
</html>
