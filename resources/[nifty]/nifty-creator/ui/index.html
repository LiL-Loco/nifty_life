<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Charaktererstellung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root" class="cr-root hidden">
    <header class="cr-bar">
      <h1 class="cr-bar__title">CHARAKTERERSTELLUNG</h1>
      <p class="cr-bar__subtitle" id="subtitle">Aussehen - Name und Stammdaten stehen bereits fest.</p>
      <button type="button" id="closeBtn" class="cr-bar__close">&times;</button>
    </header>
    <div id="panelStack" class="cr-stack"></div>

      <span>Q/E drehen &middot; &uarr;/&darr; Zoom &middot; ESC schliesst</span>
    </div>
  </div>

</html>
