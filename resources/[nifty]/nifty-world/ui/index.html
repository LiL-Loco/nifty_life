<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nifty Life 2.0 — Character</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HUD + panels (vertical slice) --------------------------------------- -->
  <div id="hud" class="hud hidden">
    <div class="hud__money">
      <span class="hud__amount" id="hudCash">0,00 $</span>
      <span class="hud__amount hud__amount--bank" id="hudBank">0,00 $</span>
    </div>
    <div class="hud__duty hidden" id="hudDuty">
      <span class="hud__duty-dot"></span>
      <span id="hudDutyLabel">—</span>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

 <div id="panel" class="panel-shell hidden">
    <div class="panel-shell__inner">
      <header class="panel-shell__header">
        <h2 id="panelTitle">—</h2>
        <button type="button" id="panelClose" class="btn btn--ghost btn--small">Schließen</button>
      </header>
      <div class="panel-shell__body" id="panelBody"></div>
    </div>
  </div>

 <script src="app.js"></script>
</body>
</html>
